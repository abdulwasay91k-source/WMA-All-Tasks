main {

    <video id="bg-video"  loop autoplay muted>
            <source src="./assets/246151_tiny.mp4">

<h1>Sign Up Form</h1>
<p>Step 1: General Information</p>
<form action="signup2.html">
<label for="name">Name:</label>
<input type="text" placeholder="Enter your name"  name="name" required>
<br>
<br>
<label for="email">Email:</label>
<input type="email" placeholder="Enter your email"  name="email" required>
<br>
<br>
<label for="pass">Password:</label>
<input type="text" placeholder="Enter your password"  name="pass" required>
<br>
<br>
<label for="dob">Date of Birth:</label>
<input type="date"  name="name" required>
<br>
<br>
<label for="gender">Gender:</label>
<input type="radio" id="male" name="gender" required>
<label for="male">Male</label>
<input type="radio" id="female" name="gender" required>
<label for="female">Female</label>
<input type="radio" id="other" name="gender" required>
<label for="other">Other</label>
<br><br>
<pre>    <label for="profile">Profile Picture:</label><input type="file" required></pre>
<br>
<button type="submit">Next</button>
</form>
<br>

    </main>
