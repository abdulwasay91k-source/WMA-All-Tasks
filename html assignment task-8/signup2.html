<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    body {
        color: black;
        text-align: center;
    }
main {
    border: 10px solid black;
    width: 300px;
    margin: 100px auto;
    height: 450px;
}
</style> 
</head>
<body>
    <main>
        <video id="bg-video" loop autoplay muted>
            <source src="./assets/246151_tiny.mp4">
        </video>
        <h1>Sign Up Form</h1>
        <b><p>Step 2:Contact Information</p></b>
        <br>
        <form action="signup3.html">
            <label for="number">Phone Number:</label>
         <input type="number" placeholder="Enter you number" name="number" required>
<br><br>
         
   <label>Country:</label>
   <select required>
            <option value="" >Select Country</option>
            <option value="" >Pakistan</option>
            <option value="">United Arab Emirates"</option>
            <option value="">Saudi Arabia</option>
            <option value="">United Kingdom</option>
            <option value="">United States</option>
            <option value="">Canada</option>
            </select>
<br><br>
<label for="address">Complete address:</label>
<textarea  placeholder="Enter complete address" rows="4"  name="address" id="address" required></textarea>
<br><br><br>
<label for="contact">Preferred Contact Method</label>
<select name="contact" id="" required>
    <option value="">Select Method</option>
    <option value="">Email</option>
    <option value="">SMS</option>
    <option value="">Phone</option>
</select>
<br><br><br>
<label for="terms">I agree to the Terms and Conditions</label>
<input type="checkbox" name="terms" required>
<br><br><br>
<button type="submit">Next</button>
        </form>
    </main>
</body>
</html>
